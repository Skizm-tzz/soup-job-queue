name: soup-queue

x-env: &env
  DATABASE_URL: postgresql://soup:soup@postgres:5432/jobs

x-app: &app
  build: .
  image: soup-queue:latest
  init: true

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: soup
      POSTGRES_PASSWORD: soup
      POSTGRES_DB: jobs
    command: ["postgres", "-c", "max_connections=300", "-c", "shared_buffers=256MB"]
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soup -d jobs"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    <<: *app
    command: ["python", "-m", "app.migrate"]
    environment:
      <<: *env
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    command: ["uvicorn", "app.api:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    environment:
      <<: *env
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *app
    command: ["python", "-m", "app.worker"]
    environment:
      <<: *env
      RELEASE_ON_START: "1"
    deploy:
      replicas: 4
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Chaos harness: starts its own API and 8 workers against a fresh database per run.
  #   docker compose --profile chaos run --rm chaos canonical --seed 1 --label C1
  chaos:
    <<: *app
    profiles: ["chaos"]
    entrypoint: ["python", "-m", "chaos.harness"]
    environment:
      ADMIN_DATABASE_URL: postgresql://soup:soup@postgres:5432/jobs
    volumes:
      - ./results:/app/results
      - ./.git:/app/.git:ro
    depends_on:
      postgres:
        condition: service_healthy

  # Load generator (open loop). Use load/run.sh, which also starts chaos.loadwatch.
  k6:
    image: grafana/k6:0.54.0
    profiles: ["load"]
    volumes:
      - ./load:/load:ro
      - ./results:/results

volumes:
  pgdata:
